      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Kotlin Android unit tests and debug APK
        run: >-
          bash ./gradlew --no-daemon --max-workers=2 --no-parallel --console=plain
          '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          -Pandroid.builder.sdkDownload=true :app:testDebugUnitTest :app:assembleDebug

      - name: Upload installable debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: PylaAndroid-NeuralRL-v4.0.1-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PylaAndroid-NeuralRL-Test-Reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
